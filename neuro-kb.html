<style>
  :root{
    --paper:#f4f2ed; --card:#fcfbf9; --ink:#242220; --muted:#928b80;
    --line:#e7e3da; --accent:#0c5b5e; --accent-soft:#e6efeb;
    --user:#3a5d5e; --user-ink:#f6f4ef; --warn:#a8442a;
    --sans:'Hanken Grotesk',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    --serif:'Newsreader','Songti SC','PingFang SC',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--sans);background:var(--paper);color:var(--ink);
    font-size:16px;line-height:1.6;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;flex-direction:column;height:100dvh;}

  .view{flex:1;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch;}
  .view.active{display:flex;flex-direction:column;}

  /* 对话顶栏 */
  #chatBar{flex-shrink:0;display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;
    border-bottom:1px solid var(--line);background:var(--card);}
  .bar-spacer{flex:1;}
  .icon-btn{flex-shrink:0;width:36px;height:36px;border-radius:9px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #modelBtn{flex-shrink:1;min-width:0;display:flex;align-items:center;gap:4px;
    background:var(--paper);border:1px solid var(--line);border-radius:9px;
    padding:0 11px;height:36px;font-family:var(--sans);font-size:13px;
    color:var(--ink);cursor:pointer;}
  #modelLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #modelBtn.unset{color:var(--warn);border-color:var(--warn);}
  #modelBtn .caret{color:var(--muted);font-size:10px;flex-shrink:0;}
  .bar-btn{flex-shrink:0;border:1px solid var(--line);background:var(--paper);
    border-radius:9px;height:36px;padding:0 13px;font-family:var(--sans);
    font-size:13px;color:var(--accent);font-weight:600;cursor:pointer;}

  #chatScroll{flex:1;overflow-y:auto;padding:18px 16px 8px;}
  .msg{margin-bottom:18px;display:flex;flex-direction:column;}
  .msg .who{font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase;}
  .bubble{padding:12px 15px;border-radius:14px;font-size:15.5px;line-height:1.65;
    white-space:pre-wrap;word-break:break-word;}
  .msg.user{align-items:flex-end;}
  .msg.user .bubble{background:var(--user);color:var(--user-ink);border-bottom-right-radius:4px;max-width:85%;}
  .msg.bot .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msg.bot .bubble.err{background:#f7e9e4;border-color:#e6c7bc;color:var(--warn);}
  .src{margin-top:7px;font-size:11.5px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .src .tag{background:var(--accent-soft);color:var(--accent);
    padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;}
  .empty-hint{text-align:center;color:var(--muted);font-family:var(--serif);
    font-style:italic;font-size:16px;margin:auto;padding:40px 30px;line-height:1.7;}
  .typing{display:flex;gap:4px;padding:4px 2px;}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);
    animation:bounce 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,80%,100%{opacity:.25;transform:translateY(0);}40%{opacity:1;transform:translateY(-4px);}}

  #inputBar{flex-shrink:0;border-top:1px solid var(--line);background:var(--card);
    padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
    display:flex;gap:8px;align-items:flex-end;}
  #qInput{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:12px;
    padding:11px 13px;font-family:var(--sans);font-size:15.5px;resize:none;
    max-height:120px;line-height:1.5;color:var(--ink);}
  #qInput:focus{outline:none;border-color:var(--accent);}
  .send-btn{flex-shrink:0;width:44px;height:44px;border-radius:12px;border:none;
    background:var(--accent);color:#fff;font-size:19px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .send-btn:disabled{background:var(--muted);opacity:.5;}

  .kb-wrap{padding:calc(env(safe-area-inset-top) + 16px) 16px 90px;}
  .kb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .kb-top .count{font-size:13px;color:var(--muted);}
  .add-btn{border:none;background:var(--accent);color:#fff;border-radius:10px;
    padding:8px 14px;font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;}
  .kb-item{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;margin-bottom:10px;}
  .kb-item h3{font-family:var(--serif);font-weight:500;font-size:16.5px;margin-bottom:3px;}
  .kb-item p{font-size:13.5px;color:var(--muted);line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .kb-item .acts{display:flex;gap:14px;margin-top:9px;}
  .kb-item .acts button{background:none;border:none;font-family:var(--sans);font-size:12.5px;
    color:var(--accent);cursor:pointer;padding:0;font-weight:600;}
  .kb-item .acts button.del{color:var(--warn);}

  .set-wrap{padding:calc(env(safe-area-inset-top) + 18px) 18px 90px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .field .desc{font-size:12px;color:var(--muted);margin-bottom:7px;line-height:1.5;}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:11px 13px;font-family:var(--sans);font-size:15px;color:var(--ink);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .prov-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .prov-grid button{
    flex:1 1 28%;border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:10px 4px;font-family:var(--sans);font-size:13px;cursor:pointer;color:var(--muted);}
  .prov-grid button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  .model-row{display:flex;gap:8px;}
  .model-row input{flex:1;}
  .refresh-btn{flex-shrink:0;border:1px solid var(--line);background:var(--card);
    border-radius:10px;padding:0 14px;font-family:var(--sans);font-size:13px;
    color:var(--accent);font-weight:600;cursor:pointer;white-space:nowrap;}
  .refresh-btn:disabled{color:var(--muted);opacity:.6;}
  .model-hint{font-size:11.5px;color:var(--muted);margin-top:6px;min-height:15px;}
  .save-btn{width:100%;border:none;background:var(--accent);color:#fff;border-radius:11px;
    padding:13px;font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;}
  .saved-flash{text-align:center;color:var(--accent);font-size:13px;margin-top:10px;height:16px;}

  nav{flex-shrink:0;display:flex;border-top:1px solid var(--line);background:var(--card);
    padding-bottom:env(safe-area-inset-bottom);}
  nav button{flex:1;background:none;border:none;padding:9px 0 8px;cursor:pointer;
    font-family:var(--sans);font-size:11px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav button .ico{font-size:19px;line-height:1;}
  nav button.on{color:var(--accent);font-weight:600;}

  .modal-bg{position:fixed;inset:0;background:rgba(33,31,27,.45);z-index:50;
    display:none;align-items:flex-end;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--paper);width:100%;border-radius:18px 18px 0 0;
    padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88dvh;overflow-y:auto;}
  .modal h2{font-family:var(--serif);font-weight:500;font-size:19px;margin-bottom:16px;}
  .modal textarea{min-height:140px;resize:vertical;line-height:1.6;}
  .modal-acts{display:flex;gap:10px;margin-top:6px;}
  .modal-acts button{flex:1;border-radius:10px;padding:12px;font-family:var(--sans);
    font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn-cancel{background:var(--card);border:1px solid var(--line);color:var(--muted);}
  .btn-ok{background:var(--accent);border:none;color:#fff;}

  /* 对话列表 */
  .convo-item{display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:9px;}
  .convo-item.on{border-color:var(--accent);background:var(--accent-soft);}
  .convo-item .ci-main{flex:1;min-width:0;cursor:pointer;}
  .convo-item .ci-title{font-size:14.5px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .convo-item .ci-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .convo-item .ci-del{flex-shrink:0;background:none;border:none;color:var(--warn);
    font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 2px;}

  /* 回复倾向预设 */
  .preset-row{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 14px;}
  .preset-row button{border:1px solid var(--line);background:var(--card);
    border-radius:8px;padding:7px 10px;font-family:var(--sans);font-size:12px;
    color:var(--accent);cursor:pointer;}

  /* 模型选择 */
  .model-pick{display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:11px;padding:13px 14px;
    margin-bottom:9px;cursor:pointer;}
  .model-pick.on{border-color:var(--accent);background:var(--accent-soft);}
  .model-pick .mp-main{flex:1;min-width:0;}
  .model-pick .mp-name{font-size:14.5px;font-weight:600;}
  .model-pick .mp-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .model-pick .mp-state{flex-shrink:0;font-size:11.5px;font-weight:600;}
  .model-pick .mp-state.ready{color:var(--accent);}
  .model-pick .mp-state.empty{color:var(--warn);}
</style>
</head>
<body>
<div id="app">

  <section class="view active" id="view-chat">
    <div id="chatBar">
      <button class="icon-btn" id="convoListBtn" aria-label="对话列表">☰</button>
      <button id="modelBtn"><span id="modelLabel">模型</span><span class="caret">▾</span></button>
      <div class="bar-spacer"></div>
      <button class="bar-btn" id="personaBtn">倾向</button>
      <button class="icon-btn" id="newChatBtn" aria-label="新对话">＋</button>
    </div>
    <div id="chatScroll"></div>
    <div id="inputBar">
      <textarea id="qInput" rows="1" placeholder="提一个问题…"></textarea>
      <button class="send-btn" id="sendBtn">↑</button>
    </div>
  </section>

  <section class="view" id="view-kb">
    <div class="kb-wrap">
      <div class="kb-top">
        <span class="count" id="kbCount">共 0 条</span>
        <button class="add-btn" id="addKbBtn">＋ 新增条目</button>
      </div>
      <div id="kbList"></div>
    </div>
  </section>

  <section class="view" id="view-set">
    <div class="set-wrap">
      <div class="field">
        <label>模型提供方</label>
        <div class="desc">每个提供方的密钥会分开记住，切换时不会丢。</div>
        <div class="prov-grid" id="provGrid"></div>
      </div>
      <div class="field" id="baseField" style="display:none;">
        <label>接口地址（Base URL）</label>
        <div class="desc">填写兼容 OpenAI 格式的接口根地址，通常以 /v1 结尾。</div>
        <input type="text" id="baseUrl" placeholder="https://...">
      </div>
      <div class="field">
        <label>API 密钥</label>
        <div class="desc">密钥只保存在本机，不会上传到任何地方。</div>
        <input type="password" id="apiKey" placeholder="粘贴你的 API Key">
      </div>
      <div class="field">
        <label>模型名称</label>
        <div class="desc">点「获取列表」自动拉取该平台可用模型，也可直接手填。</div>
        <div class="model-row">
          <input type="text" id="modelName" list="modelList" placeholder="默认" autocomplete="off">
          <button class="refresh-btn" id="fetchModelsBtn">获取列表</button>
        </div>
        <datalist id="modelList"></datalist>
        <div class="model-hint" id="modelHint"></div>
      </div>
      <div class="field">
        <label>默认回复倾向</label>
        <div class="desc">新建对话时默认采用的回答偏好。每个对话仍可在「倾向」里单独修改。</div>
        <textarea id="defaultPersona" rows="3" placeholder="例如：回答简明扼要，先给结论；必要时列出鉴别诊断。"></textarea>
      </div>
      <div class="field">
        <label>对话中的称呼</label>
        <div class="desc">聊天气泡上方显示的名字，可自定义。</div>
        <div class="model-row">
          <input type="text" id="userName" placeholder="我" maxlength="10">
          <input type="text" id="botName" placeholder="助手" maxlength="10">
        </div>
      </div>
      <button class="save-btn" id="saveSetBtn">保存设置</button>
      <div class="saved-flash" id="savedFlash"></div>
    </div>
  </section>

  <nav>
    <button class="on" data-v="chat"><span class="ico">✦</span>查询</button>
    <button data-v="kb"><span class="ico">❑</span>知识库</button>
    <button data-v="set"><span class="ico">⚙</span>设置</button>
  </nav>
</div>

<!-- 知识库条目编辑 -->
<div class="modal-bg" id="kbModal">
  <div class="modal">
    <h2 id="kbModalTitle">新增条目</h2>
    <div class="field">
      <label>标题</label>
      <input type="text" id="kbTitle" placeholder="如：急性缺血性卒中 — 溶栓时间窗">
    </div>
    <div class="field">
      <label>内容</label>
      <textarea id="kbContent" placeholder="录入这条知识的正文…"></textarea>
    </div>
    <div class="modal-acts">
      <button class="btn-cancel" id="kbCancel">取消</button>
      <button class="btn-ok" id="kbSave">保存</button>
    </div>
  </div>
</div>

<!-- 对话列表 -->
<div class="modal-bg" id="convoModal">
  <div class="modal">
    <h2>对话列表</h2>
    <div id="convoList"></div>
    <button class="save-btn" id="newConvoBtn">＋ 新建对话</button>
  </div>
</div>

<!-- 回复倾向 -->
<div class="modal-bg" id="personaModal">
  <div class="modal">
    <h2>这个对话的回复倾向</h2>
    <div class="field">
      <div class="desc">写下希望 AI 在这个对话里遵循的回答偏好。只影响当前对话。</div>
      <textarea id="personaText" placeholder="例如：回答尽量简短；多列鉴别诊断；优先引用最新指南。"></textarea>
    </div>
    <div class="preset-row" id="personaPresets"></div>
    <div class="modal-acts">
      <button class="btn-cancel" id="personaCancel">取消</button>
      <button class="btn-ok" id="personaSave">保存</button>
    </div>
  </div>
</div>

<!-- 模型选择（当前对话） -->
<div class="modal-bg" id="modelModal">
  <div class="modal">
    <h2>这个对话使用的模型</h2>
    <div class="desc" style="margin-bottom:12px;">
      切换只影响当前对话，历史上下文会保留。灰色的需要先到「设置」里填密钥。</div>
    <div id="modelPickList"></div>
  </div>
</div>

<script>
"use strict";

/* ---------- 模型提供方配置 ---------- */
const PROVIDERS = {
  claude:   { label:"Claude",   type:"anthropic", base:"https://api.anthropic.com",                       model:"claude-sonnet-4-6" },
  openai:   { label:"GPT",      type:"openai",    base:"https://api.openai.com/v1",                        model:"gpt-4o" },
  gemini:   { label:"Gemini",   type:"gemini",    base:"https://generativelanguage.googleapis.com/v1beta", model:"gemini-2.0-flash" },
  deepseek: { label:"DeepSeek", type:"openai",    base:"https://api.deepseek.com/v1",                      model:"deepseek-chat" },
  qwen:     { label:"通义千问", type:"openai",    base:"https://dashscope.aliyuncs.com/compatible-mode/v1", model:"qwen-plus" },
  grok:     { label:"Grok",     type:"openai",    base:"https://api.x.ai/v1",                              model:"grok-4" },
  custom:   { label:"自定义",   type:"openai",    base:"",                                                 model:"" }
};
const PROV_KEYS = Object.keys(PROVIDERS);

/* 回复倾向预设 */
const PERSONA_PRESETS = [
  "回答简明扼要，先给结论，少铺垫。",
  "尽量详细，展开机制与背景。",
  "突出鉴别诊断，列出需要排除的情况。",
  "优先参考最新临床指南，并注明指南名称与年份。"
];

/* ---------- 存储层：优先环境持久化，回退 localStorage ---------- */
const Store = {
  async get(k){
    try{ if(window.storage){ const r=await window.storage.get(k); return r?r.value:null; } }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){ return null; }
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k,v,false); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){}
  }
};

/* ---------- 状态 ---------- */
let settings = { provider:"claude", keys:{}, models:{}, customBase:"",
                 defaultPersona:"", userName:"我", botName:"助手" };
let knowledge = [];
let conversations = [];     // 多个对话，每个 {id,title,createdAt,log,persona,provider}
let currentId = null;       // 当前打开的对话 id
let editingId = null;
let busy = false;

/* ---------- 工具函数 ---------- */
function newConvoObj(){
  return {
    id: "c" + Date.now() + Math.random().toString(36).slice(2,6),
    title: "新对话",
    createdAt: Date.now(),
    log: [],                            // [{role:'user'|'bot', content, sources?}]
    persona: settings.defaultPersona || "",
    provider: settings.provider || "claude"   // 该对话使用的模型提供方
  };
}
function curConvo(){
  return conversations.find(c=>c.id===currentId) || null;
}
function fmtDate(ts){
  const d = new Date(ts);
  const p = n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function openModal(id){ document.getElementById(id).classList.add("show"); }
function closeModal(id){ document.getElementById(id).classList.remove("show"); }

/* ---------- 初始化 ---------- */
async function init(){
  const s = await Store.get("nkb_settings");
  if(s){
    try{
      const o = JSON.parse(s);
      // 兼容旧版本格式 {provider,key,model}
      if(o.key!==undefined && !o.keys){
        settings.provider = o.provider || "claude";
        settings.keys = {}; settings.models = {};
        if(o.key) settings.keys[settings.provider] = o.key;
        if(o.model) settings.models[settings.provider] = o.model;
      }else{
        settings = Object.assign({provider:"claude",keys:{},models:{},customBase:"",
          defaultPersona:"",userName:"我",botName:"助手"}, o);
      }
    }catch(e){}
  }
  if(!settings.userName) settings.userName = "我";
  if(!settings.botName) settings.botName = "助手";
  const k = await Store.get("nkb_knowledge");
  if(k){ try{ knowledge = JSON.parse(k)||[]; }catch(e){} }

  const cv = await Store.get("nkb_convos");
  if(cv){ try{ conversations = JSON.parse(cv)||[]; }catch(e){} }
  const ci = await Store.get("nkb_current");
  if(ci) currentId = ci;

  // 迁移：旧版本单一聊天记录 → 转成第一个对话
  if(conversations.length===0){
    const old = await Store.get("nkb_chatlog");
    if(old){
      try{
        const oldLog = JSON.parse(old)||[];
        if(oldLog.length){
          conversations.push({
            id:"c"+Date.now(), title:"（之前的对话）",
            createdAt:Date.now(), log:oldLog, persona:"", provider:settings.provider
          });
        }
      }catch(e){}
    }
  }
  // 旧对话补齐 provider 字段
  conversations.forEach(c=>{ if(!c.provider) c.provider = settings.provider || "claude"; });
  // 至少保证有一个对话
  if(conversations.length===0) conversations.push(newConvoObj());
  if(!currentId || !curConvo()) currentId = conversations[0].id;

  buildProvGrid();
  buildPersonaPresets();
  renderSettings();
  renderKb();
  refreshStatus();
  renderHistory();
}

async function fetchModels(){
  captureFields();
  const prov = PROVIDERS[settings.provider];
  const key = settings.keys[settings.provider] || "";
  let base = settings.provider==="custom" ? (settings.customBase||"") : prov.base;
  base = base.replace(/\/+$/,"");
  if(!key){ setModelHint("请先填写 API 密钥再获取列表。", true); return; }
  if(settings.provider==="custom" && !base){ setModelHint("自定义提供方需先填接口地址。", true); return; }

  const btn = document.getElementById("fetchModelsBtn");
  btn.disabled = true; btn.textContent = "获取中…";
  setModelHint("正在拉取模型列表…", false);

  try{
    let ids = [];
    if(prov.type==="anthropic"){
      const r = await fetch(base + "/v1/models",{
        headers:{ "x-api-key":key, "anthropic-version":"2023-06-01",
                  "anthropic-dangerous-direct-browser-access":"true" }
      });
      const d = await r.json();
      if(!r.ok) throw new Error(d.error?.message || ("请求失败 "+r.status));
      ids = (d.data||[]).map(m=>m.id);
    }else if(prov.type==="gemini"){
      const r = await fetch(base + "/models?key=" + encodeURIComponent(key));
      const d = await r.json();
      if(!r.ok) throw new Error(d.error?.message || ("请求失败 "+r.status));
      ids = (d.models||[])
        .filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
        .map(m=>(m.name||"").replace(/^models\//,""));
    }else{
      const r = await fetch(base + "/models",{
        headers:{ "authorization":"Bearer "+key }
      });
      const d = await r.json();
      if(!r.ok) throw new Error(d.error?.message || ("请求失败 "+r.status));
      ids = (d.data||[]).map(m=>m.id);
    }
    ids = [...new Set(ids)].filter(Boolean).sort();
    if(ids.length===0){ setModelHint("接口返回空列表，请手动填写模型名。", true); }
    else{
      fillModelList(ids);
      setModelHint("已获取 " + ids.length + " 个模型，点输入框可下拉选择。", false);
    }
  }catch(err){
    setModelHint("获取失败：" + err.message + "（可直接手填模型名）", true);
  }
  btn.disabled = false; btn.textContent = "获取列表";
}

/* ---------- 检索：中文友好的二元字组匹配 ---------- */
function bigrams(s){
  s = (s||"").toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,"");
  const g=[];
  for(let i=0;i<s.length-1;i++) g.push(s.slice(i,i+2));
  return g;
}
function retrieve(query){
  if(knowledge.length===0) return [];
  if(knowledge.length<=6) return knowledge.slice();
  const qg = [...new Set(bigrams(query))];
  const scored = knowledge.map(e=>{
    const text = ((e.title||"")+" "+(e.content||"")).toLowerCase();
    let score = 0;
    qg.forEach(g=>{ if(text.includes(g)) score++; });
    return { e, score };
  });
  scored.sort((a,b)=>b.score-a.score);
  const hit = scored.filter(x=>x.score>0).slice(0,5).map(x=>x.e);
  return hit.length ? hit : knowledge.slice(0,3);
}

       + "3. 不得编造知识库中不存在的内容。回答简洁、专业、准确。\n\n【知识库摘录】\n";
    used.forEach((e,i)=>{ p += `〔${i+1}〕${e.title||"无标题"}\n${e.content||""}\n\n`; });
  }else{

       + "并在开头注明「以下回答来自通用知识，未基于个人知识库」。回答简洁、专业、准确。";
  }

    p += "\n\n【本次对话的回复偏好】\n在不违反上述规则的前提下，请尽量遵循以下偏好：\n" + persona.trim();
  }
  return p;
}

/* ---------- 模型调用（流式） ---------- */
// onDelta(textChunk) 每收到一段文本就回调；返回完整文本
// providerKey 指定本次使用哪个提供方（默认回退全局设置）
async function callModel(system, history, onDelta, providerKey){
  const pk = providerKey || settings.provider;
  const prov = PROVIDERS[pk];
  const key = settings.keys[pk] || "";
  const model = settings.models[pk] || prov.model;
  let base = pk==="custom" ? (settings.customBase||"") : prov.base;
  base = base.replace(/\/+$/,"");

  if(!key) throw new Error("「" + prov.label + "」还没有配置 API 密钥，请到「设置」里填写");
  if(pk==="custom" && !base) throw new Error("自定义提供方需要先填写接口地址");
  if(!model) throw new Error("请先在设置里填写模型名称");

  let url, headers, body, parseSSE;

  if(prov.type==="anthropic"){
    url = base + "/v1/messages";
    headers = {
      "content-type":"application/json",
      "x-api-key":key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    };
    body = JSON.stringify({ model, max_tokens:1500, system, stream:true,
      messages:history.map(m=>({role:m.role,content:m.content})) });
    parseSSE = (obj)=>{
      if(obj.type==="content_block_delta" && obj.delta && obj.delta.text) return obj.delta.text;
      return "";
    };
  }else if(prov.type==="gemini"){
    url = base + "/models/" + model + ":streamGenerateContent?alt=sse&key=" + encodeURIComponent(key);
    headers = { "content-type":"application/json" };
    body = JSON.stringify({
      systemInstruction:{ parts:[{text:system}] },
      contents:history.map(m=>({
        role: m.role==="assistant" ? "model" : "user",
        parts:[{text:m.content}]
      }))
    });
    parseSSE = (obj)=>{
      try{ return obj.candidates[0].content.parts.map(p=>p.text||"").join(""); }
      catch(e){ return ""; }
    };
  }else{
    // openai 兼容：GPT / DeepSeek / 千问 / Grok / 自定义
    url = base + "/chat/completions";
    headers = { "content-type":"application/json", "authorization":"Bearer "+key };
    body = JSON.stringify({ model, stream:true,
      messages:[{role:"system",content:system}, ...history] });
    parseSSE = (obj)=>{
      try{ return obj.choices[0].delta.content || ""; }
      catch(e){ return ""; }
    };
  }

  const r = await fetch(url,{ method:"POST", headers, body });
  if(!r.ok){
    let msg = "请求失败 " + r.status;
    try{ const d = await r.json(); msg = d.error?.message || msg; }catch(e){}
    throw new Error(msg);
  }

  // 读取 SSE 流
  const reader = r.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buf = "", full = "";
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    buf += decoder.decode(value, {stream:true});
    const lines = buf.split("\n");
    buf = lines.pop();                       // 末行可能不完整，留到下一轮
    for(let line of lines){
      line = line.trim();
      if(!line || !line.startsWith("data:")) continue;
      const payload = line.slice(5).trim();
      if(payload==="[DONE]") continue;
      let obj;
      try{ obj = JSON.parse(payload); }catch(e){ continue; }
      const piece = parseSSE(obj);
      if(piece){ full += piece; if(onDelta) onDelta(piece); }
    }
  }
  if(!full) throw new Error("未收到内容（可能该接口不支持流式，或返回为空）");
  return full;
}

  const convo = curConvo();

  if(!convo || !convo.log.length){

      + '在下方提出你的神经内科问题。<br>回答会优先依据你自己录入的知识库，并标注引用来源。</div>';

const qInput = document.getElementById("qInput");
const sendBtn = document.getElementById("sendBtn");
qInput.addEventListener("input",()=>{
  qInput.style.height = "auto";
  qInput.style.height = Math.min(qInput.scrollHeight,120) + "px";
});

async function send(){
  if(busy) return;
  const q = qInput.value.trim();
  if(!q) return;
  const convo = curConvo();
  if(!convo) return;
  if(!settings.keys[convo.provider]){
    addMsg("err","当前对话使用「" + PROVIDERS[convo.provider].label
      + "」，但还没有配置它的 API 密钥。请到「设置」填写，或点顶栏模型按钮换一个已配置的。");
    return;
  }

  busy = true; sendBtn.disabled = true;
  qInput.value = ""; qInput.style.height = "auto";

  const used = retrieve(q);
  addMsg("user", q);
  convo.log.push({ role:"user", content:q });
  // 首次提问：用问题前几个字自动命名对话
  const wasUntitled = (!convo.title || convo.title==="新对话");
  if(wasUntitled){
    convo.title = q.slice(0,16) + (q.length>16 ? "…" : "");
  }
  addTyping();

  // 发给模型的历史 = 当前对话已有消息
  const history = convo.log.map(m=>({
    role: m.role==="user" ? "user" : "assistant",
    content: m.content
  }));

  try{
    const system = buildSystemPrompt(used, convo.persona);
    let bubble = null;
    let acc = "";
    const answer = await callModel(system, history, (piece)=>{
      if(!bubble){
        removeTyping();
        bubble = addMsg("bot", "", used);   // 收到第一个字才建气泡
      }
      acc += piece;
      bubble.textContent = acc;
      scrollDown();
    }, convo.provider);
    if(!bubble){ removeTyping(); addMsg("bot", answer, used); }
    convo.log.push({ role:"bot", content:answer, sources:used.map(e=>({title:e.title})) });
    saveConvos();
  }catch(err){
    removeTyping();
    addMsg("err","调用失败：" + err.message
      + "\n\n（如提示网络或 CORS 相关，多为浏览器直连限制，我们下一步再处理。）");
    // 这一轮失败：撤回刚加入的用户消息，避免污染历史与存档
    if(convo.log.length && convo.log[convo.log.length-1].role==="user") convo.log.pop();
    if(wasUntitled && convo.log.length===0){ convo.title = "新对话"; }
    saveConvos();
  }
  busy = false; sendBtn.disabled = false;
}
sendBtn.addEventListener("click", send);

/* 回车键：手机端回车换行（靠发送按钮发送）；电脑端回车发送、Shift+回车换行 */
const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;
qInput.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    if(isTouchDevice) return;          // 手机：不拦截，回车即换行
    e.preventDefault(); send();        // 电脑：回车发送
  }
});

  renderHistory();

  renderConvoList();
  renderHistory();

function renderConvoList(){

  box.innerHTML = "";
  conversations.forEach(c=>{

    div.className = "convo-item" + (c.id===currentId ? " on" : "");

    t.className = "ci-title";

    meta.className = "ci-meta";
    const n = c.log.filter(m=>m.role==="user").length;
    meta.textContent = `${n} 个提问 · ${fmtDate(c.createdAt)}`
      + (c.persona && c.persona.trim() ? " · 已设倾向" : "");
    main.appendChild(t); main.appendChild(meta);
    main.addEventListener("click",()=>switchConvo(c.id));
    const del = document.createElement("button");
    del.className = "ci-del";
    del.textContent = "删除";
    del.addEventListener("click",(e)=>{ e.stopPropagation(); deleteConvo(c.id); });
    div.appendChild(main); div.appendChild(del);
    box.appendChild(div);
  });
}
document.getElementById("convoListBtn").addEventListener("click",()=>{
  renderConvoList();
  openModal("convoModal");
});
document.getElementById("newConvoBtn").addEventListener("click", newConversation);
document.getElementById("newChatBtn").addEventListener("click", newConversation);
document.getElementById("convoModal").addEventListener("click",e=>{
  if(e.target.id==="convoModal") closeModal("convoModal");
});

/* ---------- 回复倾向 ---------- */
function buildPersonaPresets(){
  const box = document.getElementById("personaPresets");
  box.innerHTML = "";
  PERSONA_PRESETS.forEach(text=>{
    const b = document.createElement("button");
    b.textContent = text.length>14 ? text.slice(0,14)+"…" : text;
    b.title = text;
    b.addEventListener("click",()=>{
      document.getElementById("personaText").value = text;
    });
    box.appendChild(b);
  });
}
function openPersonaModal(){
  const convo = curConvo();
  document.getElementById("personaText").value = convo ? (convo.persona||"") : "";
  openModal("personaModal");
}
document.getElementById("personaBtn").addEventListener("click", openPersonaModal);
document.getElementById("personaCancel").addEventListener("click",()=>closeModal("personaModal"));
document.getElementById("personaModal").addEventListener("click",e=>{
  if(e.target.id==="personaModal") closeModal("personaModal");
});
document.getElementById("personaSave").addEventListener("click",()=>{
  const convo = curConvo();
  if(convo){
    convo.persona = document.getElementById("personaText").value;
    saveConvos();
  }
  closeModal("personaModal");
});

/* ---------- 模型切换（当前对话） ---------- */
function renderModelPicker(){
  const box = document.getElementById("modelPickList");
  box.innerHTML = "";
  const convo = curConvo();
  const cur = convo ? convo.provider : settings.provider;
  PROV_KEYS.forEach(pk=>{
    const prov = PROVIDERS[pk];
    const hasKey = !!settings.keys[pk];
    const div = document.createElement("div");
    div.className = "model-pick" + (pk===cur ? " on" : "");
    const main = document.createElement("div");
    main.className = "mp-main";
    const name = document.createElement("div");
    name.className = "mp-name";
    name.textContent = prov.label;
    const meta = document.createElement("div");
    meta.className = "mp-meta";
    meta.textContent = settings.models[pk] || prov.model || "（未指定模型）";
    main.appendChild(name); main.appendChild(meta);
    const state = document.createElement("div");
    state.className = "mp-state " + (hasKey ? "ready" : "empty");
    state.textContent = hasKey ? (pk===cur ? "使用中" : "可用") : "未配置";
    div.appendChild(main); div.appendChild(state);
    div.addEventListener("click",()=>{
      if(!hasKey){
        // 未配密钥：跳到设置页
        closeModal("modelModal");
        settings.provider = pk;
        renderSettings();
        document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
        document.querySelector('nav button[data-v="set"]').classList.add("on");
        document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
        document.getElementById("view-set").classList.add("active");
        return;
      }
      if(convo){
        convo.provider = pk;
        saveConvos();
        refreshStatus();
      }
      closeModal("modelModal");
    });
    box.appendChild(div);
  });
}
document.getElementById("modelBtn").addEventListener("click",()=>{
  renderModelPicker();
  openModal("modelModal");
});
document.getElementById("modelModal").addEventListener("click",e=>{
  if(e.target.id==="modelModal") closeModal("modelModal");
});
